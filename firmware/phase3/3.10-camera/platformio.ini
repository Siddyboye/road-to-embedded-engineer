; PlatformIO project file for the AI-Thinker ESP32-CAM (classic ESP32, not the S3).
; Flash through the FTDI adapter: hold IO0 to GND, press reset, run  pio run -t upload,
; then remove the IO0 jumper, press reset again and run  pio device monitor.
; espressif32 8.x ships ESP-IDF 6.1, the version this lab was written against.
[platformio]
src_dir = main
default_envs = esp32cam

[env:esp32cam]
platform = espressif32 @ ^8.0.0
framework = espidf
board = esp32cam
monitor_speed = 115200
; keep the adapter's control lines from holding the board in reset while the monitor is open
monitor_rts = 0
monitor_dtr = 0
