; Build with PlatformIO instead of idf.py:  pio run -t upload -t monitor
; Reference solution for the ESP32-S3. espressif32 8.x ships ESP-IDF 6.1, the version it was written against.
[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ ^8.0.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
monitor_speed = 115200
