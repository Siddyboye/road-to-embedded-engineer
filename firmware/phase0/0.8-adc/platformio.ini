; Build this lab with PlatformIO instead of idf.py. Same sources, same sdkconfig defaults.
;   pio run -e esp32s3 -t upload -t monitor
; espressif32 8.x ships ESP-IDF 6.1, the version this course is written against.
[platformio]
src_dir = main
default_envs = esp32s3

[env]
platform = espressif32 @ ^8.0.0
framework = espidf
monitor_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
